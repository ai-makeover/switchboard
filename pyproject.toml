[project]
name = "switchboard"
version = "0.2.0"
description = "Owner-only remote MCP server for your own WhatsApp, LinkedIn and Instagram DMs, through Unipile"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.2.0",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["switchboard*"]

[tool.setuptools.package-data]
switchboard = ["static/*"]
